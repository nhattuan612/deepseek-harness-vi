name: Check

on:
  push:
  pull_request:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: master
          path: upstream
      - run: bun run check
      - run: bun run check:upstream -- upstream
      - run: bun run check:docs -- upstream
